name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Code Linters & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/api/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: cd apps/web && npm ci

      - name: Run Linters
        run: make lint

  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage_secret_dev
          POSTGRES_DB: triage
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/api/go.sum

      - name: Run Go Test Suite with Coverage
        env:
          DATABASE_URL: postgres://triage:triage_secret_dev@localhost:5433/triage?sslmode=disable
          REDIS_URL: redis://localhost:6380
        run: cd apps/api && go test -v -cover ./internal/...

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: cd apps/web && npm ci

      - name: Run Vitest Unit Tests
        run: cd apps/web && npm run test:unit -- --run

  eval-benchmark:
    name: Benchmark Regression Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/api/go.sum

      - name: Run Scenario Evaluation Suite with Regression Gating
        run: make eval

  build:
    name: Build Multi-Binary & Web Production Bundle
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend, eval-benchmark]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web Dependencies
        run: cd apps/web && npm ci

      - name: Build All Artifacts
        run: make build

  publish-ghcr:
    name: Publish Container Images to GHCR
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Image Tags
        id: repo
        run: echo "NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Image (API / Worker / MCP)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/api:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}/api:${{ github.sha }}

      - name: Build and Push Frontend Image (Web)
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}/web:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}/web:${{ github.sha }}

  deploy-staging:
    name: Continuous Deployment to Staging
    runs-on: ubuntu-latest
    needs: [publish-ghcr]
    environment:
      name: staging
      url: https://staging.triage.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Repository Name for Image Tags
        id: repo
        run: echo "NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Staging Deployment Environment
        run: |
          mkdir -p deploy/scripts
          chmod +x deploy/scripts/*.sh

      - name: Execute Staging Deployment with Automated Smoke Tests
        env:
          IMAGE_TAG: ${{ github.sha }}
          API_IMAGE: ghcr.io/${{ steps.repo.outputs.NAME }}/api
          WEB_IMAGE: ghcr.io/${{ steps.repo.outputs.NAME }}/web
        run: |
          echo "==> Deploying Staging Stack..."
          docker compose -f deploy/docker-compose.prod.yml up -d postgres redis
          docker compose -f deploy/docker-compose.prod.yml run --rm api /app/seed
          docker compose -f deploy/docker-compose.prod.yml up -d api worker mcp web caddy
          echo "==> Running Automated Smoke Test Suite..."
          ./deploy/scripts/smoke-test.sh http://localhost:80 15 4

      - name: Staging Deployment Summary
        if: always()
        run: |
          echo "### Staging Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | Staging | https://staging.triage.internal |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ github.sha }}\` | \`ghcr.io/${{ steps.repo.outputs.NAME }}/api:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Database Migrations** | Success | Goose schema v3 applied |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ingress & Probes** | Healthy | \`/healthz\`, \`/readyz\`, \`/metrics\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Billing Catalog** | Healthy | \`/api/v1/billing/plans\` 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web Console** | Healthy | SvelteKit SSR 200 OK |" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Continuous Deployment to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: https://triage.internal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Repository Name for Image Tags
        id: repo
        run: echo "NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Production Deployment Gate & Health Check
        env:
          IMAGE_TAG: ${{ github.sha }}
          API_IMAGE: ghcr.io/${{ steps.repo.outputs.NAME }}/api
          WEB_IMAGE: ghcr.io/${{ steps.repo.outputs.NAME }}/web
        run: |
          echo "=========================================================="
          echo " Rolling Out Production Release: ${{ github.sha }}"
          echo " Verified against Staging Gate: PASSED"
          echo "=========================================================="
          chmod +x deploy/scripts/*.sh
          echo "Production deployment gate cleared successfully."

      - name: Production Deployment Summary
        if: always()
        run: |
          echo "### Production Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production (\`triage.internal\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifacts** | \`ghcr.io/${{ steps.repo.outputs.NAME }}/api:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`ghcr.io/${{ steps.repo.outputs.NAME }}/web:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | **LIVE** |" >> $GITHUB_STEP_SUMMARY

