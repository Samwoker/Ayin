version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triage-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage} -d ${POSTGRES_DB:-triage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  redis:
    image: redis:7-alpine
    container_name: triage-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  api:
    image: ${API_IMAGE:-ghcr.io/seraph/triage/api}:${IMAGE_TAG:-latest}
    container_name: triage-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage_secret_dev}@postgres:5432/${POSTGRES_DB:-triage}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-key-min-32-chars-long-abc}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_pro_monthly}
      APP_URL: ${APP_URL:-https://triage.internal}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  worker:
    image: ${API_IMAGE:-ghcr.io/seraph/triage/api}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/worker"]
    container_name: triage-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage_secret_dev}@postgres:5432/${POSTGRES_DB:-triage}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-key-min-32-chars-long-abc}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  mcp:
    image: ${API_IMAGE:-ghcr.io/seraph/triage/api}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/mcp", "--transport=sse", "--addr=:8081"]
    container_name: triage-mcp
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage_secret_dev}@postgres:5432/${POSTGRES_DB:-triage}?sslmode=disable
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  web:
    image: ${WEB_IMAGE:-ghcr.io/seraph/triage/web}:${IMAGE_TAG:-latest}
    container_name: triage-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_API_URL: http://api:8080
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

  caddy:
    image: caddy:2.8-alpine
    container_name: triage-caddy
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - triage-net

networks:
  triage-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
