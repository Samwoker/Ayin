version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-triage}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triage} -d ${POSTGRES_DB:-triage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - triage-net

  redis:
    image: redis:7-alpine
    container_name: triage-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - triage-net

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: triage-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage_secret_dev}@postgres:5432/${POSTGRES_DB:-triage}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-key-min-32-chars-long-abc}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - triage-net

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    entrypoint: ["/app/worker"]
    container_name: triage-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-triage}:${POSTGRES_PASSWORD:-triage_secret_dev}@postgres:5432/${POSTGRES_DB:-triage}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-key-min-32-chars-long-abc}
      WORKER_CONCURRENCY: 5
    networks:
      - triage-net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: triage-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_API_URL: http://api:8080
    ports:
      - "3000:3000"
    networks:
      - triage-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: triage-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - triage-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: triage-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - triage-net

networks:
  triage-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
