openapi: 3.1.0
info:
  title: Triage Incident Agent API
  version: 0.1.0
  description: Autonomous multi-tenant incident triage agent API for ingestion, investigations, hypotheses, and remediations.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service and downstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/status:
    get:
      summary: API status check
      operationId: getStatus
      responses:
        '200':
          description: API status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No active organization memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Get active tenant and identity profile
      operationId: getMe
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Current user identity profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/api-keys:
    get:
      summary: List API keys for active organization
      operationId: listApiKeys
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create new API key
      operationId: createApiKey
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created with raw token shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '403':
          description: Forbidden (requires admin role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/api-keys/{id}:
    delete:
      summary: Revoke an API key
      operationId: revokeApiKey
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  revoked_at:
                    type: string
                    format: date-time
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/incidents:
    get:
      summary: List incidents for active organization
      operationId: listIncidents
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
    post:
      summary: Create an incident
      operationId: createIncident
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /api/v1/incidents/{id}:
    get:
      summary: Get incident details with alerts and timeline events
      operationId: getIncident
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed incident object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
        '404':
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/incidents/{id}/status:
    patch:
      summary: Update incident status
      operationId: updateIncidentStatus
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [open, investigating, mitigated, resolved, closed]
      responses:
        '200':
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /api/v1/incidents/{id}/runs:
    get:
      summary: List investigation runs for an incident
      operationId: listIncidentRuns
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
    post:
      summary: Launch new investigation run for incident
      operationId: createRun
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Run created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'

  /api/v1/runs/{id}:
    get:
      summary: Get investigation run details, hypotheses, and steps
      operationId: getRun
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailResponse'

  /api/v1/runs/{id}/steps:
    get:
      summary: List step logs for an investigation run
      operationId: getRunSteps
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Step logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunStep'

  /api/v1/runs/{id}/stream:
    get:
      summary: Real-time Server-Sent Events (SSE) investigation stream
      operationId: streamRun
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          description: Optional auth token for browser EventSource
          schema:
            type: string
      responses:
        '200':
          description: Event stream of investigation steps and hypotheses
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/runbooks:
    get:
      summary: List runbooks for active organization
      operationId: listRunbooks
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of runbooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Runbook'
    post:
      summary: Create new runbook
      operationId: createRunbook
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunbookRequest'
      responses:
        '201':
          description: Runbook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'

  /api/v1/runbooks/{id}:
    get:
      summary: Get runbook by ID
      operationId: getRunbook
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Runbook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'
    put:
      summary: Update runbook
      operationId: updateRunbook
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunbookRequest'
      responses:
        '200':
          description: Updated runbook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runbook'
    delete:
      summary: Delete runbook
      operationId: deleteRunbook
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Runbook deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"

  /api/v1/ingest/webhooks/{source}:
    post:
      summary: Ingest alerts from monitoring provider for authenticated tenant
      operationId: ingestWebhook
      security:
        - WebhookHmacAuth: []
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: source
          in: path
          required: true
          description: Alert source provider
          schema:
            type: string
            enum: [alertmanager, grafana, pagerduty, generic]
        - name: X-Signature-256
          in: header
          description: HMAC-SHA256 signature calculated over timestamp + raw payload
          schema:
            type: string
        - name: X-Timestamp
          in: header
          description: Unix timestamp in seconds or RFC3339 timestamp
          schema:
            type: string
        - name: X-Org-ID
          in: header
          description: Organization ID when not using Bearer/ApiKey auth
          schema:
            type: string
            format: uuid
        - name: org_id
          in: query
          description: Organization ID as query parameter fallback
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Webhook payload from provider
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Alert ingested and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestResponse'
        '400':
          description: Invalid payload or unsupported source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ingest/{org_id}/webhooks/{source}:
    post:
      summary: Ingest alerts from monitoring provider for specific organization
      operationId: ingestWebhookForOrg
      security:
        - WebhookHmacAuth: []
        - {}
      parameters:
        - name: org_id
          in: path
          required: true
          description: Target organization UUID
          schema:
            type: string
            format: uuid
        - name: source
          in: path
          required: true
          description: Alert source provider
          schema:
            type: string
            enum: [alertmanager, grafana, pagerduty, generic]
        - name: X-Signature-256
          in: header
          description: HMAC-SHA256 signature calculated over timestamp + raw payload
          schema:
            type: string
        - name: X-Timestamp
          in: header
          description: Unix timestamp in seconds or RFC3339 timestamp
          schema:
            type: string
      requestBody:
        required: true
        description: Webhook payload from provider
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Alert ingested and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestResponse'
        '400':
          description: Invalid payload or unsupported source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tools:
    get:
      summary: List all investigation tools available to active organization
      operationId: listTools
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of available investigation tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'

  /api/v1/tools/{name}/execute:
    post:
      summary: Execute an investigation tool on-demand within tenant boundary
      operationId: executeTool
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Tool name (e.g. log_search, recent_deploys, service_topology, query_metrics, search_runbooks, similar_incidents)
          schema:
            type: string
      requestBody:
        required: true
        description: Tool input parameters adhering to the tool JSON schema
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Tool executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecutionResult'
        '400':
          description: Invalid tool input or execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecutionResult'

  /api/v1/incidents/{id}/remediations:
    get:
      summary: List remediations for an incident
      operationId: listRemediationsForIncident
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of remediations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationListResponse'
    post:
      summary: Propose a remediation for an incident
      operationId: proposeRemediation
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeRemediationRequest'
      responses:
        '201':
          description: Remediation proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remediation'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/remediations/{id}:
    get:
      summary: Get remediation details and audit event trail
      operationId: getRemediation
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Remediation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationDetailResponse'
        '404':
          description: Remediation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/remediations/{id}/approve:
    post:
      summary: Approve and execute a proposed remediation
      operationId: approveRemediation
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRemediationRequest'
      responses:
        '200':
          description: Remediation approved and executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationApprovalResponse'
        '404':
          description: Remediation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid transition state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Remediation expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/remediations/{id}/reject:
    post:
      summary: Reject a proposed remediation
      operationId: rejectRemediation
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRemediationRequest'
      responses:
        '200':
          description: Remediation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remediation'
        '404':
          description: Remediation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid transition state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/remediations/{id}/rollback:
    post:
      summary: Rollback a succeeded remediation
      operationId: rollbackRemediation
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRemediationRequest'
      responses:
        '200':
          description: Remediation rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationRollbackResponse'
        '404':
          description: Remediation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid transition state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    WebhookHmacAuth:
      type: apiKey
      in: header
      name: X-Signature-256
      description: HMAC-SHA256 signature calculated over timestamp + raw payload with organization webhook secret

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp, service]
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: "triage-api"

    ReadyResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: "ready"
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string

    StatusResponse:
      type: object
      required: [status, version, service, environment, uptime_seconds, timestamp]
      properties:
        status:
          type: string
          example: "online"
        version:
          type: string
          example: "0.1.0"
        service:
          type: string
          example: "triage-api"
        environment:
          type: string
          example: "development"
        uptime_seconds:
          type: integer
          example: 120
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        request_id:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        org_id:
          type: string
          format: uuid

    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, user, org]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserDTO'
        org:
          $ref: '#/components/schemas/OrgDTO'

    UserDTO:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string

    OrgDTO:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          example: "Bearer"

    MeResponse:
      type: object
      required: [user_id, org_id, role, email, is_apikey]
      properties:
        user_id:
          type: string
        org_id:
          type: string
        role:
          type: string
        email:
          type: string
        is_apikey:
          type: boolean

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
