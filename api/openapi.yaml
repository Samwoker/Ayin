openapi: 3.1.0
info:
  title: Triage Incident Agent API
  version: 0.1.0
  description: Autonomous incident triage agent API for ingestion, investigations, hypotheses, and remediations.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service and downstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/status:
    get:
      summary: API status check
      operationId: getStatus
      responses:
        '200':
          description: API status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: "triage-api"
      required:
        - status
        - timestamp
        - service
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: "ready"
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
      required:
        - status
        - timestamp
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "online"
        version:
          type: string
          example: "0.1.0"
        service:
          type: string
          example: "triage-api"
        environment:
          type: string
          example: "development"
        uptime_seconds:
          type: integer
          example: 120
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            type: string
      required:
        - status
        - version
        - service
        - environment
        - uptime_seconds
        - timestamp
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        request_id:
          type: string
      required:
        - error
